name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:ci-local-password@localhost:5432/ajksolutions_ecommerce?schema=public
      NUXT_SESSION_PASSWORD: ci-only-session-secret-with-more-than-32-characters
      SEED_ADMIN_EMAIL: admin-ci@ajksolutions.local
      SEED_ADMIN_PASSWORD: AjkSolutions-CI-2026
      SEED_ADMIN_FIRST_NAME: CI
      SEED_ADMIN_LAST_NAME: Administrator
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Prepare PostgreSQL installed on the runner
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql --file .github/ci-postgres.sql
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
